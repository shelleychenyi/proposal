<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LaLa Quest | MSP Member App 3.0 Proposal</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&family=Plus+Jakarta+Sans:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0E1A33;--blue:#2B67B0;--orange:#F39A1E;--mint:#22C2A0;--pink:#FF6FA3;--teal:#1E9C9A;--navy:#15325E;--gold:#FFD3A3;--ink:#1E1A1D}
  html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;font-family:"Noto Sans TC","PingFang TC",sans-serif;color:var(--ink)}
  #viewport{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  #stage{position:relative;flex:none;width:1600px;height:900px;transform-origin:center center;background:#000;overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;transition:opacity .45s ease;pointer-events:none}
  .slide.on{opacity:1;pointer-events:auto}
  .slide>img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .slide video.ph{position:absolute;object-fit:cover;background:#0E1A33}
  #bar{position:fixed;left:0;bottom:0;height:4px;background:linear-gradient(90deg,var(--blue),var(--orange));transition:width .3s;z-index:9}
  #num{position:fixed;right:16px;bottom:12px;font-size:12px;color:#fff;opacity:.6;z-index:9}
  #hint{position:fixed;left:16px;bottom:12px;font-size:12px;color:#fff;opacity:.7;z-index:10}
  #hint a{color:var(--gold)}
  .nav{position:fixed;top:0;bottom:60px;width:12%;cursor:pointer;z-index:8}
  #prev{left:0}#next{right:0}
  #dl{position:fixed;top:12px;right:16px;z-index:11;display:flex;gap:8px;align-items:center;font-size:12px;color:#fff}
  #dl span{opacity:.6}
  #dl a{color:#fff;text-decoration:none;background:rgba(255,255,255,.14);padding:5px 12px;border-radius:20px;font-weight:700}
  #dl a.b{background:var(--orange)}
  #dl a:hover{background:rgba(255,255,255,.3)}

  /* ---------- IDEA ---------- */
  .idea video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .idea .shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(14,26,51,.85),rgba(14,26,51,.2) 70%)}
  .idea .txt{position:absolute;left:126px;top:200px;width:760px;color:#fff}
  .idea .k{color:var(--orange);font-weight:700;font-size:21px;letter-spacing:.08em}
  .idea h1{margin:16px 0 0;font-size:66px;line-height:1.18;font-weight:900}
  .idea h1 small{display:block;font-family:"Plus Jakarta Sans";font-size:30px;color:var(--gold);margin-top:10px}
  .idea p{color:#fff;font-size:22px;line-height:1.9;margin-top:34px;opacity:.95}
  .idea p b{color:var(--orange)}

  /* ---------- Island world ---------- */
  .world{position:absolute;left:4.05%;top:14.4%;width:91.9%;height:70.7%;border-radius:6px;overflow:hidden;
    background:url(assets/img/sky.jpg) center/cover}
  .isl{position:absolute;width:23%;top:4%;cursor:pointer;text-align:center;animation:bob 4.5s ease-in-out infinite;transition:filter .3s}
  .isl img{width:100%;display:block;filter:drop-shadow(0 18px 18px rgba(30,60,110,.25));transition:transform .45s cubic-bezier(.3,1.6,.5,1),filter .3s}
  .isl:hover img,.isl.act img{transform:translateY(-26px) scale(1.07);filter:drop-shadow(0 36px 26px rgba(30,60,110,.35)) brightness(1.06)}
  .isl .pill{display:inline-block;margin-top:-6px;color:#fff;font-weight:900;font-size:19px;padding:7px 22px;border-radius:30px;box-shadow:0 6px 14px rgba(0,0,0,.15);position:relative}
  .isl .sub{display:block;margin:8px auto 0;width:86%;background:#fff;border-radius:14px;padding:8px 10px;font-size:14px;font-weight:700;line-height:1.4;box-shadow:0 6px 16px rgba(0,0,0,.08)}
  .isl:nth-child(2){animation-delay:-1.1s;top:9%}.isl:nth-child(3){animation-delay:-2.2s}.isl:nth-child(4){animation-delay:-3.3s;top:9%}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
  .isl .spark{position:absolute;left:50%;top:30%;width:10px;height:10px;border-radius:50%;background:#fff;opacity:0;pointer-events:none}
  .isl:hover .spark{animation:spark 1s ease-out}
  @keyframes spark{0%{opacity:.9;box-shadow:0 0 0 0 rgba(255,255,255,.8)}100%{opacity:0;box-shadow:0 0 0 120px rgba(255,255,255,0)}}
  .card{position:absolute;right:2.5%;bottom:4%;width:34%;background:rgba(255,255,255,.96);border-radius:22px;padding:22px 26px;box-shadow:0 20px 40px rgba(20,40,80,.25);
    transform:translateY(20px);opacity:0;transition:all .35s;pointer-events:none}
  .card.show{transform:none;opacity:1;pointer-events:auto}
  .card h3{margin:0;font-size:24px;font-weight:900}
  .card ul{margin:12px 0 0;padding-left:20px;font-size:16px;line-height:1.75;font-weight:700;color:#3a3a3a}
  .card a{display:inline-block;margin-top:12px;font-size:14px;font-weight:900;color:#fff;padding:7px 16px;border-radius:20px;text-decoration:none;cursor:pointer}
  .card .x{position:absolute;right:16px;top:12px;font-size:20px;color:#999;cursor:pointer}
  .hintw{position:absolute;left:2%;bottom:3%;background:rgba(14,26,51,.75);color:#fff;font-size:13px;font-weight:700;padding:6px 14px;border-radius:20px}

  /* ---------- Tier characters ---------- */
  .tiers{position:absolute;left:5.4%;top:16.6%;width:89.5%;height:63.4%;display:flex;gap:1.6%}
  .tc{flex:1;background:#F6F4F4;border-radius:16px;position:relative;text-align:center;border-top:7px solid var(--c);cursor:pointer;transition:transform .35s,box-shadow .35s;overflow:hidden}
  .tc:hover{transform:translateY(-10px);box-shadow:0 20px 34px rgba(0,0,0,.14)}
  .tc .ch{height:52%;display:flex;align-items:flex-end;justify-content:center;padding-top:14px}
  .tc .ch img{max-height:100%;max-width:82%;animation:bob 3.2s ease-in-out infinite;transition:transform .4s cubic-bezier(.3,1.7,.5,1)}
  .tc:nth-child(2) .ch img{animation-delay:-.8s}.tc:nth-child(3) .ch img{animation-delay:-1.6s}.tc:nth-child(4) .ch img{animation-delay:-2.4s}
  .tc:hover .ch img{transform:scale(1.12) rotate(-3deg)}
  .tc h4{margin:14px 0 0;font-family:"Plus Jakarta Sans";font-weight:800;font-size:32px;color:var(--c);letter-spacing:.04em}
  .tc .th{font-size:15px;color:#5E5558;font-weight:700;margin-top:4px}
  .tc .pk{font-size:17px;font-weight:900;line-height:1.7;margin-top:14px}
  .tc .more{position:absolute;left:0;right:0;bottom:0;background:var(--c);color:#fff;font-size:15px;font-weight:700;padding:14px 12px;line-height:1.6;transform:translateY(100%);transition:transform .35s}
  .tc:hover .more{transform:none}
  .tc.legend .ch img{filter:drop-shadow(0 0 18px rgba(255,200,90,.6))}
  .tagai{position:absolute;background:#000;color:#fff;font-size:12px;font-weight:700;padding:4px 10px;border-radius:20px;z-index:3}
</style>
</head>
<body>
<div id="dl"><a class="b" href="prototype/index.html" target="_blank">Try the App Prototype ↗</a></div>
<div id="viewport"><div id="stage"></div></div>
<div class="nav" id="prev"></div><div class="nav" id="next"></div>
<div id="bar"></div><div id="num"></div><div id="hint">← → Navigate | F Fullscreen | <a href="prototype/index.html" target="_blank">Try the App Prototype →</a></div>

<script>
const N = 54, IW = 13.333, IH = 7.5;
const VIDEO = {"19": [["home", 5.1362, 1.85, 1.6173, 3.5], ["tiers", 7.0396, 1.85, 1.6173, 3.5], ["missions", 8.9431, 1.85, 1.6173, 3.5], ["parking", 10.8465, 1.85, 1.6173, 3.5]], "21": [["home", 0.9, 1.3, 2.1025, 4.55], ["checkout", 3.4525, 2.0148, 5.5475, 3.1205]], "26": [["tierflow", 0.9, 1.3, 2.1025, 4.55], ["lvscene", 3.4525, 2.0148, 5.5475, 3.1205]], "27": [["missions", 0.9, 1.3, 2.0101, 4.35]], "29": [["receipt", 0.9, 1.3, 2.0101, 4.35]], "31": [["park_scene_en", 0.6, 1.3, 6.0475, 2.95], ["parking", 7.0475, 1.3, 2.1025, 4.55]], "33": [["go_scene_en", 0.6, 1.3, 7.245, 2.95], ["bus", 8.245, 1.3, 2.1025, 4.55], ["busticket", 10.6475, 1.3, 2.1025, 4.55]], "36": [["scan", 0.9, 1.3, 2.1025, 4.55]], "37": [["ask", 0.9, 1.3, 2.1025, 4.55]], "38": [["buzz", 8.245, 1.3, 2.1025, 4.55], ["brand", 10.6475, 1.3, 2.1025, 4.55]], "39": [["quest", 0.9, 1.3, 2.1025, 4.55]], "40": [["capsule", 0.9, 1.3, 2.1025, 4.55]], "46": [["omt_en", 4.9372, 0, 8.3958, 7.5]]};
const SPECIAL = {idea: 9, islands: 0, tiers: 24};
const JUMP = {levelup: 21, play: 25, ask: 29, buzz: 33};
const img = n => `assets/slides/s-${String(n).padStart(2, '0')}.jpg`;
const stage = document.getElementById('stage');

const ISL = [
  {k: "levelup", c: "#13294B", name: "Level Up Island", sub: "4 tiers: parking, multipliers, capsules grow",
   li: ["Rookie → Explorer → Senpai → Legend", "Parking 3H → all day, points 1x → 2x", "Level up with 12 visits, student-friendly", "Full-screen Level Up moment, made to share"]},
  {k: "play", c: "#8C6E3C", name: "Play Island", sub: "Check-in · Quests · Stamps · LaLa Capsule",
   li: ["Daily check-in streak, free capsule on day 7", "Makan Quest, Squad Quest", "ACG Matsuri / Bon Odori stamp rallies", "24 LaLa Capsule characters to trade with kawan"]},
  {k: "ask", c: "#1E3A63", name: "Ask Island", sub: "AI receipt scan · Ask LaLa · For You",
   li: ["Snap a receipt, points in 1 sec, tier multiplier applied", "Ask LaLa in English, Malay or Chinese", "Plans your day, finds food and parking exits", "For You: everyone gets a different home"]},
  {k: "buzz", c: "#B8975A", name: "Buzz Island", sub: "Pandora reviews + Real Talk",
   li: ["Pandora social listening collects IG & Threads posts daily", "Pandora AI judges sentiment into a Buzz Score + summary", "Real Talk: verified receipts only, +20 pts", "Take me there: one-tap navigation after reading"]}];
const TIERS = [
  {k: "rookie", c: "#8F8A80", n: "ROOKIE", th: "LV1 | On sign-up", pk: "1x points · 3H parking<br>1 draw a day", more: "A new LaLa with a little sprout: daily check-ins and a birthday gift, growing from the very first receipt."},
  {k: "explorer", c: "#13294B", n: "EXPLORER", th: "LV2 | RM1,500 or 12 visits", pk: "1.2x points · 4H parking<br>Birthday 2x points", more: "Backpack on, map in hand: come often to level up, with priority collab café booking."},
  {k: "senpai", c: "#B8975A", n: "SENPAI", th: "LV3 | RM5,000", pk: "1.5x points · 5H parking<br>Priority event entry", more: "Festival happi coat and lantern: priority entry to Bon Odori and ACG Matsuri, 2 draws a day."},
  {k: "legend", c: "#0B1A30", n: "LEGEND", th: "LV4 | RM12,000", pk: "2x points · all-day parking<br>Legend Lounge", more: "Gold-trimmed cape and crown: the mall knows your name, plus the annual Legend Night."}];

function buildIslands(el) {
  el.innerHTML += `<div class="world"><div class="tagai" style="left:1.5%;top:2.5%">AI mock-up</div>
    ${ISL.map((d, i) => `<div class="isl" data-i="${i}" style="left:${1.5 + i * 24.6}%"><div class="spark"></div>
      <img src="assets/img/isl_${d.k}.png" alt=""><span class="pill" style="background:${d.c}">${d.name}</span>
      <span class="sub">${d.sub}</span></div>`).join('')}
    <div class="card"><span class="x">×</span><h3></h3><ul></ul><a>See this chapter →</a></div>
    <div class="hintw">👆 Tap an island for details</div></div>`;
  const card = el.querySelector('.card'), isls = [...el.querySelectorAll('.isl')];
  isls.forEach(isl => isl.addEventListener('click', e => {
    e.stopPropagation();
    const d = ISL[+isl.dataset.i];
    isls.forEach(x => x.classList.toggle('act', x === isl));
    card.querySelector('h3').textContent = d.name;
    card.querySelector('h3').style.color = d.c;
    card.querySelector('ul').innerHTML = d.li.map(t => `<li>${t}</li>`).join('');
    const a = card.querySelector('a'); a.style.background = d.c; a.onclick = ev => { ev.stopPropagation(); show(JUMP[d.k]); };
    card.style.left = (+isl.dataset.i < 2) ? 'auto' : '2.5%'; card.style.right = (+isl.dataset.i < 2) ? '2.5%' : 'auto';
    card.classList.add('show');
  }));
  card.querySelector('.x').onclick = e => { e.stopPropagation(); card.classList.remove('show'); isls.forEach(x => x.classList.remove('act')); };
  el.querySelector('.world').addEventListener('click', e => e.stopPropagation());
}

function buildTiers(el) {
  el.innerHTML += `<div class="tiers">${TIERS.map(t => `<div class="tc ${t.k}" style="--c:${t.c}">
    <div class="ch"><img src="assets/img/char_${t.k}.png" alt=""></div><h4>${t.n}</h4><div class="th">${t.th}</div>
    <div class="pk">${t.pk}</div><div class="more">${t.more}</div></div>`).join('')}</div>
    <div class="tagai" style="left:6.2%;top:18.6%">AI mock-up</div>`;
  el.querySelector('.tiers').addEventListener('click', e => e.stopPropagation());
}

const els = [];
for (let n = 1; n <= N; n++) {
  const el = document.createElement('div');
  el.className = 'slide';
  if (n === SPECIAL.idea) {
    el.classList.add('idea');
    el.innerHTML = `<video src="assets/video/idea_bg.mp4" muted loop playsinline preload="none" poster="assets/img/idea_poster.jpg"></video><div class="shade"></div>
      <div class="txt"><div class="k">IDEA</div><h1>LaLa Quest<br>Park. Ride. Level up.<small>Every visit levels you up.</small></h1>
      <p><b>Core</b>　Tiers · Mission Wall · LPR parking · LaLa Go bus times<br><b>AI</b>　Instant receipt scan, Ask LaLa, LaLa Buzz reviews<br><b>Play</b>　Check-ins, quests, stamps, capsules</p></div>
      <div class="tagai" style="right:40px;bottom:30px">AI mock-up video</div>`;
  } else {
    el.innerHTML = `<img class="bg" src="${img(n)}" alt="" loading="lazy">`;
    (VIDEO[n] || []).forEach(v => {
      el.innerHTML += `<video class="ph" src="assets/video/${v[0]}.mp4" poster="assets/img/${v[0]}.jpg" muted loop playsinline preload="none"
        style="left:${v[1] / IW * 100}%;top:${v[2] / IH * 100}%;width:${v[3] / IW * 100}%;height:${v[4] / IH * 100}%"></video>`;
    });
    if (n === SPECIAL.islands) buildIslands(el);
    if (n === SPECIAL.tiers) buildTiers(el);
  }
  stage.appendChild(el);
  els.push(el);
}

let i = Math.min(N, Math.max(1, parseInt(location.hash.slice(1)) || 1));
function show(n) {
  const prev = els[i - 1];
  prev.querySelectorAll('video').forEach(v => v.pause());
  prev.classList.remove('on');
  i = Math.min(N, Math.max(1, n));
  const el = els[i - 1];
  el.classList.add('on');
  el.querySelectorAll('video').forEach(v => { v.currentTime = 0; v.play().catch(() => {}); });
  document.getElementById('num').textContent = `${i} / ${N}`;
  document.getElementById('bar').style.width = `${i / N * 100}%`;
  history.replaceState(null, '', `#${i}`);
  [i, i + 1].forEach(k => { const e = els[k]; if (e) e.querySelectorAll('img[loading]').forEach(im => im.loading = 'eager'); });
}
function fitStage() {
  const s = Math.min(innerWidth / 1600, innerHeight / 900);
  stage.style.transform = `scale(${s})`;
}
addEventListener('resize', fitStage); fitStage();
addEventListener('keydown', e => {
  if (['ArrowRight', 'PageDown', ' ', 'Enter'].includes(e.key)) { e.preventDefault(); show(i + 1); }
  if (['ArrowLeft', 'PageUp', 'Backspace'].includes(e.key)) { e.preventDefault(); show(i - 1); }
  if (e.key === 'Home') show(1);
  if (e.key === 'End') show(N);
  if (e.key === 'f' || e.key === 'F') document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
});
document.getElementById('prev').onclick = () => show(i - 1);
document.getElementById('next').onclick = () => show(i + 1);
addEventListener('hashchange', () => { const n = parseInt(location.hash.slice(1)); if (n && n !== i) show(n); });
els[i - 1].classList.add('on'); show(i);
</script>
</body>
</html>
